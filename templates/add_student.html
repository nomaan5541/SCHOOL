{% extends "base.html" %}

{% block page_title %}Add Student{% endblock %}

{% block content %}
<div class="form-container">
    <h2 class="form-title">Add New Student</h2>
    
    <form method="POST" enctype="multipart/form-data" class="student-form">
        <div class="form-grid">
            <!-- Basic Information -->
            <div class="form-section">
                <h3>Basic Information</h3>
                
                <div class="form-group">
                    <label for="name">Student Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="roll_number">Roll Number *</label>
                        <input type="text" id="roll_number" name="roll_number" required>
                    </div>
                    <div class="form-group">
                        <label for="admission_no">Admission Number *</label>
                        <input type="text" id="admission_no" name="admission_no" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="class_name">Class *</label>
                        <select id="class_name" name="class_name" required>
                            <option value="">Select Class</option>
                            <option value="Nursery">Nursery</option>
                            <option value="LKG">LKG</option>
                            <option value="UKG">UKG</option>
                            <option value="1st CLASS">1st CLASS</option>
                            <option value="2nd CLASS">2nd CLASS</option>
                            <option value="3rd CLASS">3rd CLASS</option>
                            <option value="4th CLASS">4th CLASS</option>
                            <option value="5th CLASS">5th CLASS</option>
                            <option value="6th CLASS">6th CLASS</option>
                            <option value="7th CLASS">7th CLASS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date of Birth *</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div class="form-group">
                        <label for="admission_date">Admission Date *</label>
                        <input type="date" id="admission_date" name="admission_date" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="blood_group">Blood Group</label>
                    <select id="blood_group" name="blood_group">
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
            </div>
            
            <!-- Parent Information -->
            <div class="form-section">
                <h3>Parent Information</h3>
                
                <div class="form-group">
                    <label for="father_name">Father's Name *</label>
                    <input type="text" id="father_name" name="father_name" required>
                </div>
                
                <div class="form-group">
                    <label for="mother_name">Mother's Name *</label>
                    <input type="text" id="mother_name" name="mother_name" required>
                </div>
                
                <div class="form-group">
                    <label for="phone_number">Phone Number *</label>
                    <input type="tel" id="phone_number" name="phone_number" required>
                </div>
                
                <div class="form-group">
                    <label for="pen_number">PEN Number</label>
                    <input type="text" id="pen_number" name="pen_number">
                </div>
            </div>
        </div>
        
        <!-- Address Information -->
        <div class="form-section">
            <h3>Address Information</h3>
            
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3"></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city">
                </div>
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state">
                </div>
                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode">
                </div>
            </div>
        </div>
        
        <!-- Additional Information -->
        <div class="form-section">
            <h3>Additional Information</h3>
            
            <div class="form-group">
                <label for="bio">Bio/Notes</label>
                <textarea id="bio" name="bio" rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label for="photo">Student Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn primary">
                <i class="fas fa-save"></i>
                Add Student
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn secondary">
                <i class="fas fa-times"></i>
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
